EXTRA.forEach((q,i)=>CH[i][1].push(...q));
const $=i=>document.getElementById(i),rnd=a=>a[Math.random()*a.length|0];
const sh=a=>{a=a.slice();for(let i=a.length;i--;){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const st={get(k,d){try{const v=localStorage.getItem('ti_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('ti_'+k,JSON.stringify(v))}catch(e){}}};
const S={name:st.get('n',''),coins:st.get('c',0),best:st.get('b',{}),snd:st.get('s',true)};
const save=()=>{st.set('n',S.name);st.set('c',S.coins);st.set('b',S.best);st.set('s',S.snd)};
const IC=['📜','🔤','⚖️','🔄','📏','🟰','↔️','🧾','✍️','🏷️','💰','📚','📒','🔍'],COL=['--c0','--c1','--c2','--c3','--c4','--c5'];
const TRE=['🗝️','🦜','🧭','🗺️','💎','👑','⚓','🔭','🏺','🪙','🦀','🐙','🐚','🏴‍☠️','⚔️','🍾'];
const RANK=[[0,'Cabin Boy'],[20,'Deckhand'],[50,'Sailor'],[100,'Navigator'],[180,'Captain'],[300,'Admiral']];
const PR=['Arrr, brilliant!','Shiver me timbers!','Yo ho ho!','Treasure found!','Smooth sailing!','Ye got it, matey!'],TY=['Blimey! Check the map 🗺️','Nearly! Read the hint 👇','Good try, matey! Look below 👇'];
const all=CH.flatMap((c,ci)=>c[1].map(q=>({q:q[0],o:q[1],a:q[2],w:q[3],c:c[0]})));
let G,AC;
function beep(n){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;n.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.8})}catch(e){}}
const FX={r:()=>beep([[660,.12],[880,.12],[1175,.22]]),w:()=>beep([[330,.18],[262,.25]]),k:()=>beep([[520,.06]]),v:()=>beep([[523,.15],[659,.15],[784,.15],[1047,.35]])};
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');scrollTo(0,0)}
const upd=()=>$('cnum').textContent=S.coins;
const rank=()=>[...RANK].reverse().find(r=>S.coins>=r[0])[1];
function home(){$('hi').textContent=`Ahoy, ${S.name}! 👋`;$('rank').textContent=`Rank: ${rank()} · Pick an island ⛵`;
 $('isl').innerHTML=CH.map((c,i)=>{const b=S.best['c'+i]||0;return `<button class="i" style="background:var(${COL[i%6]})" onclick="FX.k();go(${i})"><div class="e">${IC[i]}</div><div class="n">${i+1}. ${c[0]}</div><div class="st">${'★'.repeat(b)+'☆'.repeat(3-b)}</div></button>`}).join('');upd();show('s-home')}
function go(i){start(all.filter(x=>x.c==CH[i][0]),CH[i][0],'c'+i)}
function start(a,t,k){G={t,k,i:0,ok:0,tries:0,done:false,Q:sh(a).map(x=>({...x,o:sh(x.o.map((s,j)=>({s,r:j==x.a})))}))};
 $('dots').innerHTML=G.Q.map(()=>'<i></i>').join('');ship();show('s-game');nq()}
function ship(){$('ship').style.left=`calc(6px + ${G.i/G.Q.length} * (100% - 100px))`;[...$('dots').children].forEach((e,n)=>e.classList.toggle('d',n<G.i))}
function nq(){const x=G.Q[G.i];G.tries=0;G.done=false;$('cht').scrollIntoView({block:'start'});$('cht').textContent=`${x.c} · ${G.i+1}/${G.Q.length}`;$('qt').textContent=x.q;
 $('ops').innerHTML=x.o.map((o,n)=>`<button class="o" style="background:var(${COL[n]})" onclick="ans(this,${n})">${o.s}</button>`).join('');
 $('fb').textContent='';$('fb').className='fb';$('mp').className='map';$('nx').style.display='none';$('hb').style.display=''}
function ans(b,n){const x=G.Q[G.i];if(G.done)return;
 if(x.o[n].r){G.done=true;b.classList.add('r');document.querySelectorAll('.o').forEach(e=>e.disabled=true);FX.r();
  if(G.tries==0){G.ok++;S.coins++;save();upd();fly(b)}
  $('fb').textContent=rnd(PR)+(G.tries==0?' +1 🪙':' You worked it out! 💪');$('fb').className='fb g';
  $('mp').innerHTML=`<b>Why?</b> ${x.w}`;$('mp').className='map on';$('hb').style.display='none';G.i++;ship();conf(8);
  $('nx').textContent=G.i>=G.Q.length?'Open the chest! 💰':'Next ➜';$('nx').style.display='inline-block'}
 else{G.tries++;b.classList.add('w');b.disabled=true;FX.w();$('fb').textContent=rnd(TY);$('fb').className='fb t';$('hb').style.display='none';
  $('mp').innerHTML=`<b>Hint 🗺️</b> ${x.w}<br>Now pick another answer above 👆`;$('mp').className='map on';$('qt').scrollIntoView({behavior:'smooth',block:'start'})}}
function fin(){FX.v();conf(50,35);const p=G.ok/G.Q.length,s=p>=.9?3:p>=.6?2:1;S.best[G.k]=Math.max(S.best[G.k]||0,s);
 const b=Math.floor((S.coins-G.ok)/10),a=Math.floor(S.coins/10);save();
 $('re').textContent=s==3?'🏆':s==2?'💰':'⛵';$('rt').textContent=s==3?`Legendary, ${S.name}!`:s==2?`Great sailing, ${S.name}!`:'You reached the island!';
 $('rs').textContent='⭐'.repeat(s)+'☆'.repeat(3-s);
 let t=`${G.ok} of ${G.Q.length} right on the first try.`;if(a>b)t+=`<br>🎁 New treasure: <span style="font-size:40px">${TRE[Math.min(a-1,TRE.length-1)]}</span>`;
 t+=s<3?'<br>Sail again for 3 stars!':'<br>Perfect run! Try the next island.';$('rx').innerHTML=t;show('s-res')}
function fly(f){const r=f.getBoundingClientRect(),t=$('cn').getBoundingClientRect(),e=document.createElement('div');e.className='fly';e.textContent='🪙';e.style.left=r.left+r.width/2-20+'px';e.style.top=r.top+'px';e.style.setProperty('--dx',t.left-r.left-r.width/2+20+'px');e.style.setProperty('--dy',t.top-r.top+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),950)}
function conf(n,d=40){for(let i=0;i<n;i++)setTimeout(()=>{const c=document.createElement('div');c.className='cf';c.textContent=rnd(['🎉','⭐','✨','🪙','💎','🦜','⚓']);c.style.left=Math.random()*100+'vw';c.style.animationDuration=1.8+Math.random()*1.8+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3800)},i*d)}
function tre(){const n=Math.floor(S.coins/10);$('ts').textContent=`You have ${S.coins} 🪙 · every 10 coins unlocks a treasure!`;
 $('tg').innerHTML=TRE.map((e,i)=>i<n?`<div class="t">${e}</div>`:`<div class="t l">${e}<small>${(i+1)*10}🪙</small></div>`).join('');show('s-tre')}
$('sd').textContent=S.snd?'🔊':'🔇';$('sd').onclick=()=>{S.snd=!S.snd;save();$('sd').textContent=S.snd?'🔊':'🔇';FX.k()};
$('hm').onclick=()=>S.name?home():show('s-name');$('cn').onclick=()=>S.name&&tre();$('tb').onclick=()=>{FX.k();tre()};
$('ng').onclick=()=>{const n=$('ni').value.trim();if(!n){$('ni').focus();return}S.name=n;save();FX.v();home()};
$('mg').onclick=()=>{FX.k();start(sh(all).slice(0,20),'Mega Treasure Hunt','mega')};
$('hb').onclick=()=>{FX.k();$('mp').innerHTML=`<b>Hint 🗺️</b> ${G.Q[G.i].w}`;$('mp').className='map on';$('hb').style.display='none'};
$('nx').onclick=()=>{FX.k();G.i>=G.Q.length?fin():nq()};
$('ag').onclick=()=>{const k=G.k;k=='mega'?start(sh(all).slice(0,20),G.t,k):go(+k.slice(1))};$('rh').onclick=home;
S.name?home():show('s-name');
</script></body></html>
